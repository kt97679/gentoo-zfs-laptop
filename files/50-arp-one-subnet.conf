# /etc/sysctl.d/50-arp-one-subnet.conf (deployed by ./deploy from the gentoo-laptop checkout)
# Docked, the dock's Ethernet and the Wi-Fi sit on the same subnet. By default Linux answers ARP
# for any of its addresses on any interface and may announce one interface's address from the
# other, so NetworkManager's address conflict detection (on by default since 1.46) took the
# laptop's own interfaces for other hosts and dropped both IPv4 addresses. Each address on its
# own interface only:
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
