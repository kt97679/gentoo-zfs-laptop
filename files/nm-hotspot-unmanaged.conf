# /etc/NetworkManager/conf.d/50-hotspot-unmanaged.conf - NetworkManager leaves ap0 alone: the
# hotspot's access point, which /usr/local/sbin/hotspot runs with hostapd (deployed by ./deploy).
# Read when NetworkManager starts; hotspot also tells a running one, for the case it has not.
[keyfile]
unmanaged-devices=interface-name:ap0
