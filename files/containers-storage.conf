# /etc/containers/storage.conf - Podman's storage settings (deploy, group tribler). This system
# has no packaged copy here; Podman's built-in defaults apply to everything not set below.
[storage]
driver = "overlay"
# Rootless images: a ZFS dataset per user outside the home (install-unity.sh,
# containers_dataset) - never snapshotted, and backups of /home do not copy them.
# Podman fills in $USER.
rootless_storage_path = "/var/lib/containers/$USER/storage"
