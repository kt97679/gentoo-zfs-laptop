hostonly="no"
nofsck="yes"
# zstd, named: ZFSBootMenu's key-injection hook appends an archive to a RAM copy of this image, and
# the kernel finds nothing after an lz4 archive (dracut's fallback when zstd and gzip are missing)
compress="zstd"
add_dracutmodules+=" zfs "
# no pool key here: ZFSBootMenu's key-injection hook brings it in RAM (files/zbm-key-injection)
install_items+=" /etc/modprobe.d/zfs.conf "
