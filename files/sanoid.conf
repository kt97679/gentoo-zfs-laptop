# /etc/sanoid/sanoid.conf - local snapshots (deployed by ./deploy), the policy of the Ubuntu laptop:
# sanoid every 15 min from /etc/cron.d/sanoid-snapshots (UTC names); hourly 24, daily 7, weekly 4,
# monthly 3 on the boot environments and the homes (children only); gentoo/storage (/home/storage,
# media) daily 7 and weekly 4 only - a deleted file's space returns within a month; gentoo/scratch
# (/var/tmp) is left out. world-update's pre-update-* snapshots are separate: sanoid prunes only
# autosnap_*.
[gentoo/ROOT]
    use_template = localhost
    recursive = yes
    process_children_only = yes
[gentoo/home]
    use_template = localhost
    recursive = yes
    process_children_only = yes
[gentoo/storage]
    use_template = storage

[template_localhost]
    frequently = 0
    hourly = 24
    daily = 7
    weekly = 4
    monthly = 3
    yearly = 0
    autosnap = yes
    autoprune = yes

[template_storage]
    frequently = 0
    hourly = 0
    daily = 7
    weekly = 4
    monthly = 0
    yearly = 0
    autosnap = yes
    autoprune = yes
