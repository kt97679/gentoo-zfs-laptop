# /etc/ssh/sshd_config.d/10-keys-only.conf (deployed by ./deploy from the gentoo-laptop checkout)
# SSH logins with a key only. sshd keeps the first value it reads, and Gentoo's sshd_config
# includes sshd_config.d/*.conf in name order, so these win over Gentoo's 9999999gentoo-*.conf.
# KbdInteractiveAuthentication matters: Gentoo sets UsePAM yes and PasswordAuthentication no, and
# PAM still takes passwords through keyboard-interactive (OpenSSH's default: yes).
# A key for a fresh install: install-gentoo.sh copies the one the install ran with over SSH.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
